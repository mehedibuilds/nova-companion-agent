service:
  host: 0.0.0.0
  port: 8080
  request_timeout_seconds: 45
telegram:
  enabled: false
  allowlist: []
workspace:
  path: workspace
providers:
  - name: ollama-cloud
    kind: openai-compatible
    base_url: https://api.ollama.com/v1
    model: llama3.3
    api_key_env: NOVA_OLLAMA_CLOUD_API_KEY
  - name: gemini
    kind: gemini
    model: gemini-2.5-flash
    api_key_env: NOVA_GEMINI_API_KEY
  - name: groq
    kind: openai-compatible
    base_url: https://api.groq.com/openai/v1
    model: openai/gpt-oss-120b
    api_key_env: NOVA_GROQ_API_KEY
  - name: nvidia-nim
    kind: openai-compatible
    base_url: https://integrate.api.nvidia.com/v1
    model: meta/llama-3.3-70b-instruct
    api_key_env: NOVA_NVIDIA_API_KEY
  - name: openrouter
    kind: openai-compatible
    base_url: https://openrouter.ai/api/v1
    model: auto
    api_key_env: NOVA_OPENROUTER_API_KEY