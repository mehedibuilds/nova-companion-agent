[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nova-agent"
version = "0.1.0"
description = "Configuration-first, self-hosted AI companion runtime."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "httpx>=0.27", "pydantic>=2.8", "pydantic-settings>=2.3", "pyyaml>=6.0", "structlog>=24.2", "uvicorn[standard]>=0.30"]

[project.optional-dependencies]
telegram = ["python-telegram-bot>=21.4"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
nova = "nova.main:run"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]